services:
  app:
    build: .
    expose:
      - "3000"
    volumes:
      - app-data:/app/data
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/app.db
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app-data:
  caddy-data:
  caddy-config:
